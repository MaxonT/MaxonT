<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="A dim night security office with a fan, a monitor and a dark hallway">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171826"/><stop offset="1" stop-color="#0c0c14"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14141d"/><stop offset="1" stop-color="#07070b"/></linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#e8b85a" stop-opacity="0.5"/><stop offset="0.5" stop-color="#e8b85a" stop-opacity="0.12"/><stop offset="1" stop-color="#e8b85a" stop-opacity="0"/></radialGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030305"/><stop offset="1" stop-color="#101018"/></linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.8"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c3a2a"/><stop offset="1" stop-color="#0d1f16"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.16"/></pattern>
    <clipPath id="hr"><rect x="0" y="-30" width="96" height="40"/></clipPath>
  </defs>

  <rect width="1200" height="380" rx="14" fill="url(#wall)"/>
  <rect y="238" width="1200" height="142" fill="url(#floor)"/>
  <path d="M0 238 H1200" stroke="#232334" stroke-width="2"/>

  <!-- wall panels -->
  <g stroke="#1e1f2e" stroke-width="2"><path d="M300 0 V238 M900 0 V238 M0 120 H300 M900 120 H1200"/></g>

  <!-- posters -->
  <g transform="translate(170 56) rotate(-3)"><rect width="110" height="140" fill="#2b2230" stroke="#4a3b52" stroke-width="2"/><g fill="#d9b86a" opacity="0.8"><circle cx="30" cy="40" r="9"/><circle cx="82" cy="40" r="9"/><circle cx="56" cy="66" r="12"/></g><path d="M30 100 q26 18 52 0" stroke="#d9b86a" stroke-width="3" fill="none" opacity="0.8"/><text x="55" y="128" font-family="'Courier New',monospace" font-size="11" fill="#d9b86a" text-anchor="middle" opacity="0.8">CELEBRATE</text></g>
  <g transform="translate(1000 62) rotate(2)"><rect width="100" height="120" fill="#232733" stroke="#3b4150" stroke-width="2"/><g fill="#8fb3c9" opacity="0.7"><rect x="14" y="16" width="72" height="8"/><rect x="14" y="34" width="52" height="6"/><rect x="14" y="48" width="60" height="6"/><rect x="14" y="62" width="40" height="6"/></g><text x="50" y="104" font-family="'Courier New',monospace" font-size="11" fill="#8fb3c9" text-anchor="middle" opacity="0.8">STAFF ONLY</text></g>

  <!-- hallway window -->
  <rect x="460" y="46" width="280" height="196" fill="url(#hall)" stroke="#2a2a3c" stroke-width="4"/>
  <g stroke="#1b1b28" stroke-width="2" fill="none"><path d="M460 46 L560 110 M740 46 L640 110 M460 242 L560 170 M740 242 L640 170 M560 110 H640 V170 H560 Z"/></g>
  <g transform="translate(600 140)"><g>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.35;0.42;0.55;0.62;1" dur="14s" repeatCount="indefinite"/>
    <ellipse cx="-12" rx="5" ry="3.5" fill="#f4f4f4"/><ellipse cx="12" rx="5" ry="3.5" fill="#f4f4f4"/><circle cx="-12" r="1.6" fill="#000"/><circle cx="12" r="1.6" fill="#000"/>
  </g></g>

  <!-- door lights -->
  <g><rect x="24" y="150" width="70" height="88" rx="4" fill="#0a0a10" stroke="#2a2a3c" stroke-width="2"/><rect x="40" y="168" width="38" height="14" rx="3" fill="#7f1d1d"/><rect x="40" y="194" width="38" height="14" rx="3" fill="#14532d"/></g>
  <g><rect x="1106" y="150" width="70" height="88" rx="4" fill="#0a0a10" stroke="#2a2a3c" stroke-width="2"/><rect x="1122" y="168" width="38" height="14" rx="3" fill="#7f1d1d"/><rect x="1122" y="194" width="38" height="14" rx="3" fill="#14532d"/></g>

  <!-- lamp light and flicker -->
  <rect width="1200" height="380" fill="url(#lamp)"><animate attributeName="opacity" values="1;1;0.75;1;0.85;1;1" keyTimes="0;0.4;0.42;0.45;0.5;0.53;1" dur="9s" repeatCount="indefinite"/></rect>

  <!-- desk -->
  <path d="M120 380 L190 262 H1010 L1080 380 Z" fill="#1a1620"/>
  <path d="M190 262 H1010" stroke="#3a3044" stroke-width="3"/>
  <!-- monitor -->
  <g transform="translate(520 196)"><rect x="-6" y="-6" width="172" height="106" rx="6" fill="#0b0b10" stroke="#34344a" stroke-width="2"/><rect width="160" height="94" fill="url(#screen)"/>
    <g stroke="#3fae6f" stroke-width="2" fill="none" opacity="0.7"><path d="M14 70 L56 44 H104 L146 70 M56 44 V20 M104 44 V20"/></g>
    <circle cx="12" cy="12" r="3" fill="#ef4444"><animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="22" y="16" font-family="'Courier New',monospace" font-size="9" fill="#7ee0a6">CAM 2B</text>
    <rect y="-20" width="160" height="14" fill="#7ee0a6" opacity="0.07"><animate attributeName="y" values="-20;100" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="68" y="100" width="24" height="22" fill="#14131a"/><rect x="48" y="120" width="64" height="8" rx="3" fill="#1d1b24"/></g>
  <!-- fan -->
  <g transform="translate(300 232)"><rect x="-4" y="14" width="8" height="26" fill="#14131a"/><rect x="-22" y="38" width="44" height="6" rx="2" fill="#14131a"/><circle r="26" fill="none" stroke="#3a3a4c" stroke-width="2"/>
    <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="0.9s" repeatCount="indefinite"/><path d="M0 0 C-6 -18 6 -24 0 -2 Z M0 0 C18 -6 24 6 2 0 Z M0 0 C6 18 -6 24 0 2 Z M0 0 C-18 6 -24 -6 -2 0 Z" fill="#4b4b60" opacity="0.7"/></g><circle r="4" fill="#6b6b84"/></g>
  <!-- cup and papers -->
  <g transform="translate(780 238)"><path d="M0 0 L36 0 L32 -46 L4 -46 Z" fill="#7f1d1d" opacity="0.85"/><rect x="2" y="-50" width="32" height="6" rx="2" fill="#e5e7eb" opacity="0.8"/><rect x="14" y="-70" width="3" height="22" fill="#e5e7eb" opacity="0.7"/></g>
  <g transform="translate(860 246) rotate(-6)"><rect width="74" height="10" fill="#cfcfd8" opacity="0.65"/><rect y="-8" width="70" height="10" fill="#e5e7eb" opacity="0.55"/></g>

  <!-- HUD -->
  <g font-family="'Courier New',monospace">
    <g transform="translate(36 52)" fill="#e5e7eb" font-size="30" font-weight="700"><g clip-path="url(#hr)"><g><animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;0 -40;0 -80;0 -120;0 -160;0 -200" dur="24s" repeatCount="indefinite"/><text y="0">12 AM</text><text y="40">1 AM</text><text y="80">2 AM</text><text y="120">3 AM</text><text y="160">4 AM</text><text y="200" fill="#4ade80">5 AM</text></g></g></g>
    <text x="36" y="78" font-size="14" fill="#9ca3af">Night 5</text>
    <g transform="translate(1164 46)" text-anchor="end"><circle cx="-52" cy="-5" r="4" fill="#ef4444"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle><text font-size="14" fill="#e5e7eb">REC</text></g>
    <g transform="translate(36 340)" fill="#e5e7eb" font-size="15"><text>Power left: 42%</text><g transform="translate(150 -13)"><rect width="14" height="14" fill="#3f9b5f"/><rect x="18" width="14" height="14" fill="#3f9b5f"/><rect x="36" width="14" height="14" fill="#c9a227"/><rect x="54" width="14" height="14" fill="#8a2a2a"/></g></g>
    <text x="600" y="352" font-size="16" fill="#f3f4f6" text-anchor="middle" opacity="0.9" style="paint-order:stroke" stroke="#000" stroke-width="3">Me at 3 AM, pushing straight to main</text>
  </g>

  <rect width="1200" height="380" rx="14" filter="url(#grain)"/>
  <rect width="1200" height="380" rx="14" fill="url(#sc)"/>
  <rect width="1200" height="380" rx="14" fill="url(#vig)"/>
  <rect x="1" y="1" width="1198" height="378" rx="13" fill="none" stroke="#2a2a3c" stroke-width="2"/>
</svg>
