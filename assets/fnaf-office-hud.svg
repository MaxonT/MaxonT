<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Animated night shift camera monitor HUD">
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2"><animate attributeName="seed" values="2;8;4;10;5" dur="0.4s" repeatCount="indefinite"/></feTurbulence><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.3"/></pattern>
    <clipPath id="feed"><rect x="400" y="20" width="400" height="160" rx="6"/></clipPath>
    <clipPath id="hr"><rect x="0" y="-48" width="120" height="58"/></clipPath>
  </defs>
  <rect width="1200" height="200" rx="12" fill="#050509"/>
  <g font-family="'Courier New',monospace" fill="#e5e7eb">
    <g transform="translate(40 80)" filter="url(#glow)" font-size="52" font-weight="700">
      <g clip-path="url(#hr)"><g><animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;0 -58;0 -116;0 -174;0 -232;0 -290" dur="12s" repeatCount="indefinite"/>
        <text y="0">12 AM</text><text y="58">1 AM</text><text y="116">2 AM</text><text y="174">3 AM</text><text y="232">4 AM</text><text y="290" fill="#22c55e">5 AM</text></g></g>
    </g>
    <text x="40" y="118" font-size="20" fill="#9ca3af">Night 5</text>
    <text x="40" y="150" font-size="16" fill="#f59e0b">Commits pushed while nobody watched</text>
    <text x="40" y="176" font-size="16" fill="#9ca3af">Survive until 6 AM</text>
  </g>
  <g clip-path="url(#feed)">
    <rect x="400" y="20" width="400" height="160" fill="#0c140e"/>
    <g stroke="#1f3a26" stroke-width="2" fill="none"><path d="M400 120 L520 90 L680 90 L800 120 M520 90 V20 M680 90 V20 M400 150 H800"/></g>
    <g transform="translate(600 96)"><g><animateTransform attributeName="transform" type="scale" values="0.6;0.6;1.4;1.4" keyTimes="0;0.5;0.9;1" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="-14" rx="6" ry="4" fill="#d7ffe0"/><ellipse cx="14" rx="6" ry="4" fill="#d7ffe0"/></g></g>
    <rect x="400" y="20" width="400" height="160" filter="url(#noise)"/><rect x="400" y="20" width="400" height="160" fill="url(#sc)"/>
    <rect x="400" y="-30" width="400" height="30" fill="#d7ffe0" opacity="0.08"><animate attributeName="y" values="-30;190" dur="3s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="400" y="20" width="400" height="160" rx="6" fill="none" stroke="#22c55e" stroke-width="2"/>
  <g font-family="'Courier New',monospace" fill="#d7ffe0" font-size="15">
    <circle cx="418" cy="40" r="5" fill="#ef4444"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
    <text x="430" y="45">CAM 2B  WEST HALL</text><text x="782" y="45" text-anchor="end">REC</text>
  </g>
  <g font-family="'Courier New',monospace" fill="#e5e7eb">
    <text x="860" y="58" font-size="20">Usage:</text>
    <g filter="url(#glow)"><rect x="940" y="40" width="34" height="22" fill="#22c55e"/><rect x="980" y="40" width="34" height="22" fill="#22c55e"/><rect x="1020" y="40" width="34" height="22" fill="#eab308"/><rect x="1060" y="40" width="34" height="22" fill="#ef4444"><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
    <text x="860" y="108" font-size="20">Power left:</text>
    <text x="1160" y="108" font-size="36" font-weight="700" text-anchor="end" fill="#f59e0b" filter="url(#glow)">42%<animate attributeName="opacity" values="1;1;0.3;1;1" keyTimes="0;0.6;0.65;0.7;1" dur="3s" repeatCount="indefinite"/></text>
    <rect x="860" y="124" width="300" height="12" fill="none" stroke="#9ca3af"/><rect x="862" y="126" width="126" height="8" fill="#f59e0b"><animate attributeName="width" values="140;110;140" dur="9s" repeatCount="indefinite"/></rect>
    <g transform="translate(1010 168)"><ellipse cx="-22" rx="11" ry="7" fill="#fff"><animate attributeName="ry" values="7;7;0.5;7" keyTimes="0;0.85;0.9;1" dur="3.5s" repeatCount="indefinite"/></ellipse><ellipse cx="22" rx="11" ry="7" fill="#fff"><animate attributeName="ry" values="7;7;0.5;7" keyTimes="0;0.85;0.9;1" dur="3.5s" repeatCount="indefinite"/></ellipse><circle cx="-22" r="3"/><circle cx="22" r="3"/></g>
  </g>
</svg>
