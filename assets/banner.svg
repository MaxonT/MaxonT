<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Tiger Yang, MaxonT banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b1140"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g>
    <circle r="150" fill="url(#glow)"><animate attributeName="cx" values="180;420;180" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="80;220;80" dur="11s" repeatCount="indefinite"/></circle>
    <circle r="120" fill="url(#glow)"><animate attributeName="cx" values="1000;760;1000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="230;60;230" dur="9s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="90" cy="50" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="260" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="40" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="270" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="70" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="150" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="600" y="132" font-size="68" font-weight="800" fill="url(#ink)">Tiger Yang</text>
    <text x="600" y="180" font-size="26" fill="#e5e7eb" letter-spacing="2">MaxonT  |  CS @ Vanderbilt University</text>
    <text x="600" y="224" font-size="19" fill="#9ca3af" letter-spacing="1">AI tools for learning  /  prompts  /  agent traces</text>
  </g>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="17" fill="none" stroke="url(#ink)" stroke-width="2" stroke-dasharray="40 20">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
