<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Night shift survival HUD">
  <rect width="1200" height="160" rx="12" fill="#07070b"/>
  <g font-family="'Courier New',monospace" fill="#e5e7eb">
    <text x="40" y="60" font-size="44" font-weight="700">5 AM</text>
    <text x="40" y="100" font-size="20" fill="#9ca3af">Night 5 survived</text>
    <text x="40" y="132" font-size="18" fill="#f59e0b">Commits pushed while nobody watched</text>
    <text x="700" y="60" font-size="22">Usage:</text>
    <rect x="800" y="38" width="40" height="26" fill="#22c55e"/><rect x="846" y="38" width="40" height="26" fill="#22c55e"/><rect x="892" y="38" width="40" height="26" fill="#eab308"/><rect x="938" y="38" width="40" height="26" fill="#ef4444"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></rect>
    <text x="700" y="110" font-size="22">Power left: 42%</text>
    <g transform="translate(1090 80)"><ellipse cx="-22" rx="11" ry="7" fill="#fff"><animate attributeName="ry" values="7;7;0.5;7" keyTimes="0;0.85;0.9;1" dur="3.5s" repeatCount="indefinite"/></ellipse><ellipse cx="22" rx="11" ry="7" fill="#fff"><animate attributeName="ry" values="7;7;0.5;7" keyTimes="0;0.85;0.9;1" dur="3.5s" repeatCount="indefinite"/></ellipse><circle cx="-22" r="3" fill="#000"/><circle cx="22" r="3" fill="#000"/></g>
  </g>
</svg>
