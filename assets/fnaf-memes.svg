<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Three original FNAF style memes about shipping code">
  <defs>
    <radialGradient id="lamp" cx="0.5" cy="0.35" r="0.7"><stop offset="0" stop-color="#7a5c1e" stop-opacity="0.55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.25"/></pattern>
    <g id="eyes"><ellipse cx="-26" cy="0" rx="12" ry="8" fill="#fff"/><ellipse cx="26" cy="0" rx="12" ry="8" fill="#fff"/><circle cx="-26" cy="0" r="3.5" fill="#000"/><circle cx="26" cy="0" r="3.5" fill="#000"/></g>
  </defs>
  <rect width="1200" height="360" rx="14" fill="#07070b"/>
  <g font-family="'Courier New',monospace" text-anchor="middle">
    <g transform="translate(20 20)">
      <rect width="370" height="320" rx="10" fill="#0d0d14" stroke="#3b3b4f"/><rect width="370" height="320" rx="10" fill="url(#lamp)"/>
      <text x="185" y="34" font-size="17" fill="#e5e7eb">Me: just one tiny fix</text>
      <g transform="translate(185 165)"><use href="#eyes"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.8;0.85;0.9;1" dur="4s" repeatCount="indefinite"/></use></g>
      <text x="185" y="270" font-size="16" fill="#f59e0b">Also me at 5 AM:</text>
      <text x="185" y="294" font-size="16" fill="#f59e0b">"why is prod down"</text>
      <rect width="370" height="320" rx="10" fill="url(#sc)"/>
    </g>
    <g transform="translate(415 20)">
      <rect width="370" height="320" rx="10" fill="#0d0d14" stroke="#3b3b4f"/>
      <text x="185" y="34" font-size="17" fill="#e5e7eb">POWER LEFT: 1%</text>
      <rect x="85" y="60" width="200" height="22" rx="4" fill="none" stroke="#9ca3af"/>
      <rect x="88" y="63" width="6" height="16" fill="#ef4444"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></rect>
      <path d="M130 250 q55 -150 110 0 Z" fill="#1a1a24"/>
      <circle cx="165" cy="190" r="11" fill="#fff"/><circle cx="205" cy="190" r="11" fill="#fff"/><circle cx="165" cy="190" r="4"/><circle cx="205" cy="190" r="4"/>
      <path d="M160 222 h50" stroke="#fff" stroke-width="3"/>
      <text x="185" y="285" font-size="16" fill="#f59e0b">My laptop battery</text>
      <text x="185" y="306" font-size="16" fill="#f59e0b">during "one last commit"</text>
      <rect width="370" height="320" rx="10" fill="url(#sc)"/>
    </g>
    <g transform="translate(810 20)">
      <rect width="370" height="320" rx="10" fill="#0d0d14" stroke="#3b3b4f"/>
      <text x="185" y="34" font-size="17" fill="#e5e7eb">Merge conflict at 3 AM</text>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-3 2;3 -2;-2 -2;0 0" dur="0.25s" repeatCount="indefinite"/>
        <circle cx="185" cy="170" r="70" fill="#1c1c28" stroke="#6b7280" stroke-width="3"/>
        <circle cx="130" cy="108" r="22" fill="#1c1c28" stroke="#6b7280" stroke-width="3"/><circle cx="240" cy="108" r="22" fill="#1c1c28" stroke="#6b7280" stroke-width="3"/>
        <circle cx="158" cy="160" r="14" fill="#fff"/><circle cx="212" cy="160" r="14" fill="#fff"/><circle cx="158" cy="160" r="6" fill="#ef4444"/><circle cx="212" cy="160" r="6" fill="#ef4444"/>
        <path d="M145 205 q40 40 80 0 l-8 18 l-12 -12 l-12 14 l-12 -14 l-12 12 Z" fill="#fff"/>
      </g>
      <text x="185" y="285" font-size="16" fill="#f59e0b">Git: "both modified"</text>
      <text x="185" y="306" font-size="16" fill="#f59e0b">Me: *screams*</text>
      <rect width="370" height="320" rx="10" fill="url(#sc)"/>
    </g>
  </g>
</svg>
