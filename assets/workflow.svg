<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="How I build: decompose, design, build, evaluate, ship">
  <defs><linearGradient id="n" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <rect width="1200" height="170" rx="16" fill="#0f1226"/>
  <path d="M110 85 H1090" stroke="#334155" stroke-width="3" stroke-dasharray="6 8"/>
  <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle" font-size="18" fill="#e5e7eb">
    <g><circle cx="110" cy="85" r="34" fill="url(#n)"/><text x="110" y="92" font-size="22" fill="#0b1020" font-weight="700">1</text><text x="110" y="145">Decompose</text></g>
    <g><circle cx="350" cy="85" r="34" fill="url(#n)"/><text x="350" y="92" font-size="22" fill="#0b1020" font-weight="700">2</text><text x="350" y="145">System design</text></g>
    <g><circle cx="600" cy="85" r="34" fill="url(#n)"/><text x="600" y="92" font-size="22" fill="#0b1020" font-weight="700">3</text><text x="600" y="145">Build with AI</text></g>
    <g><circle cx="850" cy="85" r="34" fill="url(#n)"/><text x="850" y="92" font-size="22" fill="#0b1020" font-weight="700">4</text><text x="850" y="145">Evaluate</text></g>
    <g><circle cx="1090" cy="85" r="34" fill="url(#n)"/><text x="1090" y="92" font-size="22" fill="#0b1020" font-weight="700">5</text><text x="1090" y="145">Ship and learn</text></g>
  </g>
  <circle r="9" cy="85" fill="#f472b6"><animate attributeName="cx" values="110;350;600;850;1090;110" dur="10s" repeatCount="indefinite"/></circle>
</svg>
