<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Bodycam HUD: my favorite FPS game">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"><animate attributeName="seed" values="3;9;5;12;7" dur="0.6s" repeatCount="indefinite"/></feTurbulence><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.78"><stop offset="0.4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.9"/></radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b312a"/><stop offset="0.5" stop-color="#434b40"/><stop offset="1" stop-color="#1c211c"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CFF9B" stop-opacity="0"/><stop offset="0.5" stop-color="#7CFF9B" stop-opacity="0.16"/><stop offset="1" stop-color="#7CFF9B" stop-opacity="0"/></linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.25"/></pattern>
    <clipPath id="tape"><rect x="400" y="14" width="400" height="34"/></clipPath>
    <clipPath id="digit"><rect x="0" y="-22" width="14" height="26"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="14" fill="url(#wall)"/>
  <g stroke="#161a16" stroke-width="2" opacity="0.7"><path d="M0 250 H1200 M0 140 H1200 M230 0 V360 M600 0 V360 M940 0 V360"/></g>
  <g fill="#0b0d0b" opacity="0.85"><circle cx="300" cy="105" r="6"/><circle cx="345" cy="190" r="4"/><circle cx="905" cy="95" r="5"/><circle cx="985" cy="215" r="7"/><circle cx="520" cy="215" r="3"/></g>
  <g stroke="#0b0d0b" stroke-width="1.5" opacity="0.85"><path d="M300 105 l-15 -10 M300 105 l13 -12 M300 105 l4 16 M985 215 l-17 5 M985 215 l13 13 M985 215 l3 -17"/></g>

  <rect width="1200" height="360" rx="14" filter="url(#grain)"/>
  <rect width="1200" height="360" rx="14" fill="url(#scan)"/>
  <rect y="-80" width="1200" height="80" fill="url(#sweep)"><animate attributeName="y" values="-80;360" dur="4s" repeatCount="indefinite"/></rect>

  <!-- flashlight cone -->
  <defs><linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff6c8" stop-opacity="0.32"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient></defs>
  <g><animateTransform attributeName="transform" type="rotate" values="-14 600 360;14 600 360;-14 600 360" dur="8s" repeatCount="indefinite"/><path d="M560 360 L380 0 H820 L640 360 Z" fill="url(#beam)"/></g>
  <g fill="#fff6c8"><circle cx="420" cy="300" r="2"><animate attributeName="cy" values="320;40" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle><circle cx="520" cy="320" r="1.6"><animate attributeName="cy" values="340;60" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/></circle><circle cx="700" cy="310" r="2"><animate attributeName="cy" values="330;30" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" repeatCount="indefinite"/></circle><circle cx="790" cy="330" r="1.5"><animate attributeName="cy" values="350;70" dur="6s" repeatCount="indefinite"/></circle><circle cx="640" cy="340" r="1.8"><animate attributeName="cy" values="350;50" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle></g>
  <g stroke="#fff" stroke-opacity="0.25" stroke-width="1.2" fill="none"><path d="M1200 0 L1090 70 L1040 66 M1090 70 L1070 130 M1090 70 L1130 110 M1060 68 L1050 40"/></g>
  <!-- compass tape -->
  <g clip-path="url(#tape)" font-family="'Courier New',monospace" font-size="17" fill="#d7ffe0" text-anchor="middle">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;-360 0" dur="12s" repeatCount="indefinite"/>
      <g id="half">
        <text x="430" y="38">N</text><text x="490" y="38">15</text><text x="550" y="38">30</text><text x="610" y="38">45</text><text x="670" y="38">60</text><text x="730" y="38">75</text>
        <path d="M460 20 v8 M520 20 v8 M580 20 v8 M640 20 v8 M700 20 v8 M760 20 v8" stroke="#d7ffe0" stroke-width="2"/>
      </g>
      <use href="#half" x="360"/><use href="#half" x="720"/>
    </g>
  </g>
  <path d="M600 52 l-8 -10 h16 z" fill="#ef4444"/>

  <!-- REC and battery -->
  <g font-family="'Courier New',monospace" fill="#f1fff3" filter="url(#glow)">
    <circle cx="46" cy="42" r="9" fill="#ef4444"><animate attributeName="opacity" values="1;0.1;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="64" y="49" font-size="22" font-weight="700" letter-spacing="3">REC</text>
    <text x="1154" y="49" font-size="19" text-anchor="end">BODYCAM 01  BAT</text>
    <rect x="1160" y="32" width="30" height="16" fill="none" stroke="#f1fff3" stroke-width="2"/><rect x="1163" y="35" width="19" height="10" fill="#7CFF9B"><animate attributeName="width" values="22;19;22" dur="6s" repeatCount="indefinite"/></rect>
  </g>

  <g font-family="'Courier New',monospace" font-size="15" fill="#f1fff3">
    <text x="46" y="84" opacity="0">ARCHER [HS] TANGO 1<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.4;0.7;0.8" dur="8s" repeatCount="indefinite"/></text>
    <text x="46" y="104" opacity="0" fill="#7CFF9B">+100 HEADSHOT<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.42;0.7;0.8" dur="8s" repeatCount="indefinite"/></text>
    <text x="46" y="124" fill="#9fb8a4">SIGNAL  ||||| LIVE</text>
  </g>
  <!-- radar -->
  <g transform="translate(110 262)" filter="url(#glow)">
    <circle r="62" fill="#04140a" fill-opacity="0.65" stroke="#7CFF9B" stroke-width="2"/>
    <circle r="41" fill="none" stroke="#7CFF9B" stroke-opacity="0.5"/><circle r="20" fill="none" stroke="#7CFF9B" stroke-opacity="0.5"/>
    <path d="M-62 0 H62 M0 -62 V62" stroke="#7CFF9B" stroke-opacity="0.4"/>
    <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/><path d="M0 0 L0 -62 A62 62 0 0 1 44 -44 Z" fill="#7CFF9B" fill-opacity="0.35"/><path d="M0 0 V-62" stroke="#7CFF9B" stroke-width="2"/></g>
    <circle cx="22" cy="-26" r="4" fill="#ef4444"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="-30" cy="14" r="4" fill="#ef4444"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#fff"/>
  </g>

  <!-- ammo and health -->
  <g font-family="'Courier New',monospace" fill="#f1fff3" text-anchor="end" filter="url(#glow)">
    <text x="1160" y="300" font-size="58" font-weight="700">30<tspan font-size="30" fill="#9fb8a4"> / 120</tspan><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.36;0.37;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="1160" y="300" font-size="58" font-weight="700" opacity="0">29<tspan font-size="30" fill="#9fb8a4"> / 120</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.37;1" dur="8s" repeatCount="indefinite"/></text>
    <rect x="900" y="316" width="260" height="10" fill="none" stroke="#f1fff3"/><rect x="902" y="318" width="214" height="6" fill="#7CFF9B"><animate attributeName="width" values="256;214;256" dur="7s" repeatCount="indefinite"/></rect>
    <text x="1160" y="344" font-size="15" fill="#9fb8a4">HEALTH 84</text>
  </g>

  <!-- timecode with ticking seconds -->
  <g font-family="'Courier New',monospace" font-size="21" fill="#f1fff3">
    <text x="228" y="338" textLength="228" lengthAdjust="spacing">2026-10-13  03:00:0</text>
    <g transform="translate(458 338)"><g clip-path="url(#digit)"><g><animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;0 -22;0 -44;0 -66;0 -88;0 -110;0 -132;0 -154;0 -176;0 -198" dur="10s" repeatCount="indefinite"/>
      <text y="0">0</text><text y="22">1</text><text y="44">2</text><text y="66">3</text><text y="88">4</text><text y="110">5</text><text y="132">6</text><text y="154">7</text><text y="176">8</text><text y="198">9</text></g></g></g>
  </g>

  <!-- reticle -->
  <g transform="translate(600 168)" fill="none" stroke="#f1fff3" stroke-width="2.5" filter="url(#glow)">
    <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/><circle r="44" stroke-dasharray="46 23"/></g>
    <circle r="22" stroke-opacity="0.8"/>
    <path d="M0 -62 V-30 M0 30 V62 M-62 0 H-30 M30 0 H62"/>
    <circle r="2.5" fill="#ef4444" stroke="none"/>
    <g stroke="#ef4444" stroke-width="3"><animate attributeName="opacity" values="0;0;1;0;0;0;0;1;0" keyTimes="0;0.3;0.32;0.4;0.6;0.7;0.72;0.76;1" dur="5s" repeatCount="indefinite"/><path d="M-16 -16 l-10 -10 M16 -16 l10 -10 M-16 16 l-10 10 M16 16 l10 10"/></g>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;4 -3;-3 3;0 0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- enemy tag -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.24;0.38;0.4" dur="8s" repeatCount="indefinite"/>
    <g transform="translate(790 186)" fill="#050605"><circle cy="-34" r="11"/><path d="M-20 -22 H20 L26 40 H-26 Z"/><path d="M-20 -18 l-14 38 M20 -18 l16 30" stroke="#050605" stroke-width="9" stroke-linecap="round"/></g>
    <g stroke="#ef4444" stroke-width="3" fill="none" filter="url(#glow)"><path d="M748 134 h-16 v16 M832 134 h16 v16 M748 236 h-16 v-16 M832 236 h16 v-16"/></g>
    <text x="790" y="124" font-family="'Courier New',monospace" font-size="16" fill="#ef4444" text-anchor="middle" filter="url(#glow)">TANGO  24m</text>
  </g>
  <path d="M760 360 L792 150" stroke="#ffe9a8" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.36;0.37;0.4;1" dur="8s" repeatCount="indefinite"/></path>
  <rect width="1200" height="360" rx="14" fill="#ffb347" opacity="0"><animate attributeName="opacity" values="0;0;0.28;0;0" keyTimes="0;0.36;0.37;0.42;1" dur="8s" repeatCount="indefinite"/></rect>
  <!-- glitch title -->
  <g font-family="'Courier New',monospace" font-weight="700" text-anchor="middle">
    <text x="600" y="268" font-size="46" fill="#22d3ee" opacity="0.8" letter-spacing="8">BODYCAM<animate attributeName="x" values="598;598;603;596;598;598" keyTimes="0;0.7;0.72;0.75;0.77;1" dur="3s" repeatCount="indefinite"/></text>
    <text x="600" y="268" font-size="46" fill="#ef4444" opacity="0.8" letter-spacing="8">BODYCAM<animate attributeName="x" values="602;602;596;604;602;602" keyTimes="0;0.7;0.72;0.75;0.77;1" dur="3s" repeatCount="indefinite"/></text>
    <text x="600" y="268" font-size="46" fill="#ffffff" letter-spacing="8">BODYCAM</text>
    <text x="600" y="300" font-size="20" fill="#d7ffe0" letter-spacing="5">MY FAVORITE FPS</text>
  </g>

  <rect width="1200" height="360" rx="14" fill="url(#vig)"/>
  <rect width="1200" height="360" rx="14" fill="#ef4444" opacity="0"><animate attributeName="opacity" values="0;0;0.16;0;0;0.1;0" keyTimes="0;0.6;0.62;0.66;0.8;0.82;1" dur="5s" repeatCount="indefinite"/></rect>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="13" fill="none" stroke="#ef4444" stroke-opacity="0.55" stroke-width="2"/>
</svg>
