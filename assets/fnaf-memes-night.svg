<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Three animated FNAF style memes about shipping code">
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"><animate attributeName="seed" values="1;6;3;9;4;11" dur="0.5s" repeatCount="indefinite"/></feTurbulence><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="lamp" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#8a6a22" stop-opacity="0.6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.95"/></radialGradient>
    <pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.28"/></pattern>
    <clipPath id="c"><rect width="370" height="340" rx="10"/></clipPath>
    <g id="eyes"><ellipse cx="-26" rx="13" ry="9" fill="#fff"/><ellipse cx="26" rx="13" ry="9" fill="#fff"/><circle cx="-26" r="4" fill="#000"/><circle cx="26" r="4" fill="#000"/></g>
  </defs>
  <rect width="1200" height="380" rx="14" fill="#050509"/>
  <g font-family="'Courier New',monospace" text-anchor="middle">

    <!-- panel 1: hallway -->
    <g transform="translate(20 20)"><g clip-path="url(#c)">
      <rect width="370" height="340" fill="#0b0b12"/>
      <g stroke="#2a2a3c" stroke-width="2" fill="none"><path d="M0 0 L150 140 M370 0 L220 140 M0 340 L150 200 M370 340 L220 200 M150 140 H220 V200 H150 Z"/><path d="M60 0 L165 140 M310 0 L205 140 M60 340 L165 200 M310 340 L205 200" stroke-opacity="0.5"/></g>
      <rect width="370" height="340" fill="url(#lamp)"><animate attributeName="opacity" values="1;0.2;1;0.1;1;1" keyTimes="0;0.1;0.14;0.5;0.54;1" dur="4s" repeatCount="indefinite"/></rect>
      <g transform="translate(185 170)"><g><animateTransform attributeName="transform" type="scale" values="0.35;0.35;1.9" keyTimes="0;0.3;1" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.35;0.95;1" dur="5s" repeatCount="indefinite"/><use href="#eyes" filter="url(#glow)"/></g></g>
      <text x="185" y="38" font-size="18" fill="#e5e7eb">Me: just one tiny fix</text>
      <text x="185" y="300" font-size="16" fill="#f59e0b">Also me at 5 AM:</text><text x="185" y="324" font-size="16" fill="#f59e0b">"why is prod down"</text>
      <rect width="370" height="340" filter="url(#noise)"/><rect width="370" height="340" fill="url(#sc)"/><rect width="370" height="340" fill="url(#vig)"/>
    </g><rect width="370" height="340" rx="10" fill="none" stroke="#3b3b4f" stroke-width="2"/></g>

    <!-- panel 2: power out -->
    <g transform="translate(415 20)"><g clip-path="url(#c)">
      <rect width="370" height="340" fill="#09090f"/>
      <rect width="370" height="340" fill="url(#lamp)"><animate attributeName="opacity" values="1;0;1;0;0;1;0" keyTimes="0;0.15;0.2;0.4;0.6;0.65;1" dur="3s" repeatCount="indefinite"/></rect>
      <g><animate attributeName="opacity" values="0;0;1;0;0;1;0" keyTimes="0;0.15;0.2;0.4;0.6;0.65;0.8" dur="3s" repeatCount="indefinite"/>
        <circle cx="130" cy="108" r="22" fill="#171722"/><circle cx="240" cy="108" r="22" fill="#171722"/>
        <path d="M125 190 q60 -130 120 0 V320 H125 Z" fill="#171722"/>
        <path d="M118 96 h134 v-8 h-30 v-46 h-74 v46 h-30 z" fill="#0f0f17"/>
        <circle cx="165" cy="150" r="12" fill="#fff"/><circle cx="205" cy="150" r="12" fill="#fff"/><circle cx="165" cy="150" r="4"/><circle cx="205" cy="150" r="4"/>
        <path d="M155 190 h60 l-6 14 l-10 -10 l-8 12 l-8 -12 l-10 10 z" fill="#e5e7eb"/>
      </g>
      <text x="185" y="38" font-size="18" fill="#e5e7eb">POWER LEFT: <tspan fill="#ef4444">1%</tspan></text>
      <rect x="105" y="52" width="150" height="24" rx="3" fill="none" stroke="#9ca3af" stroke-width="2"/><rect x="258" y="60" width="6" height="8" fill="#9ca3af"/>
      <rect x="108" y="55" width="10" height="18" fill="#ef4444"><animate attributeName="width" values="140;10" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/></rect>
      <text x="185" y="300" font-size="16" fill="#f59e0b">My laptop battery</text><text x="185" y="324" font-size="16" fill="#f59e0b">during "one last commit"</text>
      <rect width="370" height="340" filter="url(#noise)"/><rect width="370" height="340" fill="url(#sc)"/><rect width="370" height="340" fill="url(#vig)"/>
    </g><rect width="370" height="340" rx="10" fill="none" stroke="#3b3b4f" stroke-width="2"/></g>

    <!-- panel 3: jumpscare -->
    <g transform="translate(810 20)"><g clip-path="url(#c)">
      <rect width="370" height="340" fill="#0a0a10"/>
      <g transform="translate(185 185)"><g>
        <animateTransform attributeName="transform" type="scale" values="0.85;0.85;1.35;1.25;1.35;0.85" keyTimes="0;0.55;0.6;0.7;0.8;1" dur="3s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="0 0;-5 3;5 -3;-4 -4;0 0" dur="0.18s" repeatCount="indefinite"/>
          <circle r="82" fill="#1c1c28" stroke="#6b7280" stroke-width="3"/>
          <circle cx="-62" cy="-70" r="26" fill="#1c1c28" stroke="#6b7280" stroke-width="3"/><circle cx="62" cy="-70" r="26" fill="#1c1c28" stroke="#6b7280" stroke-width="3"/>
          <circle cx="-30" cy="-12" r="17" fill="#fff"/><circle cx="30" cy="-12" r="17" fill="#fff"/><circle cx="-30" cy="-12" r="7" fill="#ef4444"/><circle cx="30" cy="-12" r="7" fill="#ef4444"/>
          <path d="M-52 32 q52 54 104 0 l-10 24 l-14 -16 l-14 20 l-14 -20 l-14 16 l-14 -16 l-10 16 Z" fill="#f3f4f6"/>
        </g></g></g>
      <rect width="370" height="340" fill="#ef4444" opacity="0"><animate attributeName="opacity" values="0;0;0.45;0;0.3;0" keyTimes="0;0.55;0.6;0.68;0.74;1" dur="3s" repeatCount="indefinite"/></rect>
      <text x="185" y="38" font-size="18" fill="#e5e7eb">Merge conflict at 3 AM</text>
      <text x="185" y="300" font-size="16" fill="#f59e0b">Git: "both modified"</text><text x="185" y="324" font-size="16" fill="#f59e0b">Me: *screams*</text>
      <rect width="370" height="340" filter="url(#noise)"/><rect width="370" height="340" fill="url(#sc)"/><rect width="370" height="340" fill="url(#vig)"/>
    </g><rect width="370" height="340" rx="10" fill="none" stroke="#3b3b4f" stroke-width="2"/></g>
  </g>
</svg>
